# This is a Declarative Automation Bundle definition for Demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Demo
  uuid: c5147b59-3748-496e-a999-9fd9ee0cd75c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e42405cc-9a90.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-e42405cc-9a90.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/adityaraman909@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/adityaraman909@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: adityaraman909@gmail.com
        level: CAN_MANAGE
